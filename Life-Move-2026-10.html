        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap');
        :root {
          --blue: #1e40af;
          --blue-700: #1c3aa0;
          --blue-50: #eef2ff;
          --blue-100: #dbeafe;
          --orange: #f59e0b;
          --orange-50: #fffbeb;
          --ink: #0f172a;
          --muted: #64748b;
          --line: #e2e8f0;
          --card: #ffffff;
          --bg: #f8fafc;
        }
        * { box-sizing: border-box; margin:0; padding:0; }
        body { background: var(--bg); }
        .root {
          font-family: "Noto Sans TC", ui-sans-serif, system-ui, -apple-system, sans-serif;
          color: var(--ink);
          background: var(--bg);
          min-height: 100vh;
          padding: 0;
          line-height: 1.6;
        }
        .page {
          max-width: 780px;
          margin: 0 auto;
          padding: 18px 16px 48px;
        }
        /* Header */
        .topbar {
          display:flex;
          justify-content:space-between;
          align-items:center;
          margin-bottom: 20px;
          font-family: "JetBrains Mono", monospace;
          font-size: 11px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--muted);
        }
        .topbar b { color: var(--blue); font-weight:700; }
        .hero {
          background: var(--card);
          border: 1.5px solid var(--line);
          border-radius: 20px;
          overflow:hidden;
          position:relative;
        }
        .hero-stripe {
          height: 6px;
          background: linear-gradient(90deg, var(--blue) 0%, #3b82f6 55%, var(--orange) 100%);
        }
        .hero-body {
          padding: 24px 22px 20px;
        }
        .kicker {
          display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px;
        }
        .pill {
          display:inline-flex; align-items:center; gap:6px;
          font-family: "JetBrains Mono", monospace;
          font-size: 11px; font-weight:700;
          letter-spacing:0.06em;
          padding: 6px 10px;
          border-radius: 999px;
          border:1px solid var(--line);
          background:#fff;
        }
        .pill.blue { background: var(--blue); color:#fff; border-color: var(--blue); }
        .pill.orange { background: var(--orange-50); color:#92400e; border-color:#fde68a; }
        .hero h1 {
          font-size: clamp(28px, 6vw, 42px);
          line-height: 1.05;
          font-weight: 900;
          letter-spacing: -0.02em;
        }
        .hero h1 span { color: var(--blue); }
        .hero h1 em { font-style:normal; color: var(--orange); }
        .hero-meta {
          margin-top:14px;
          display:grid;
          grid-template-columns: 1fr 1fr;
          gap:12px;
        }
        .meta-card {
          background: var(--bg);
          border:1px solid var(--line);
          border-radius:12px;
          padding:10px 12px;
        }
        .meta-label { font-size:10px; color:var(--muted); font-family:"JetBrains Mono",monospace; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:2px; }
        .meta-val { font-size:13px; font-weight:700; }
        .meta-val small { font-weight:500; color:var(--muted); }
        /* Section */
        .section { margin-top:28px; }
        .section-head {
          display:flex; align-items:end; justify-content:space-between; gap:12px; margin-bottom:14px;
        }
        .section-head h2 {
          font-size: 18px; font-weight:900; letter-spacing:-0.01em;
          display:flex; align-items:center; gap:8px;
        }
        .section-head h2 i {
          width:28px; height:28px; display:inline-grid; place-items:center;
          background: var(--ink); color:#fff; border-radius:8px; font-size:14px; font-style:normal;
        }
        .section-head p { font-size:12px; color:var(--muted); }
        /* Cards */
        .cards { display:grid; gap:14px; }
        .ph-card {
          background: var(--card);
          border:1.5px solid var(--line);
          border-radius:16px;
          padding:18px 18px 16px;
          position:relative;
          overflow:hidden;
        }
        .ph-card::before{
          content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
          background: var(--blue);
        }
        .ph-card.orange::before{ background: var(--orange); }
        .ph-card.dark::before{ background: var(--ink); }
        .ph-top { display:flex; gap:12px; align-items:flex-start; }
        .ph-icon {
          width:44px; height:44px; border-radius:12px;
          display:grid; place-items:center; font-size:22px;
          background: var(--blue-50); border:1px solid var(--blue-100); flex-shrink:0;
        }
        .ph-card.orange .ph-icon { background: var(--orange-50); border-color:#fde68a; }
        .ph-card.dark .ph-icon { background:#f1f5f9; border-color:var(--line); }
        .ph-badge {
          font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:0.08em;
          background: var(--ink); color:#fff; padding:3px 7px; border-radius:999px; display:inline-flex; margin-bottom:6px;
        }
        .ph-card.orange .ph-badge { background: var(--orange); color:#000; }
        .ph-card h3 { font-size:16px; font-weight:800; line-height:1.3; margin-bottom:8px; }
        .ph-card ul { list-style:none; display:grid; gap:7px; margin-top:10px; }
        .ph-card li {
          font-size:13px; line-height:1.5; padding-left:20px; position:relative; color:#334155;
        }
        .ph-card li::before{
          content:""; position:absolute; left:0; top:7px; width:8px; height:8px; border-radius:999px; background: var(--blue);
        }
        .ph-card.orange li::before{ background: var(--orange); }
        .ph-card.dark li::before{ background: var(--ink); }
        .ph-card li b { color:var(--ink); }
        .ph-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
        .tag {
          font-size:11px; font-weight:600; padding:4px 8px; border-radius:999px;
          background:#f1f5f9; border:1px solid var(--line); color:#475569;
        }
        /* Age Table */
        .age-grid {
          display:grid; grid-template-columns: 1fr; gap:10px;
        }
        .age-row {
          display:grid; grid-template-columns: 96px 1fr;
          background:#fff; border:1.5px solid var(--line); border-radius:14px; overflow:hidden;
        }
        .age-label {
          padding:14px 12px; display:flex; flex-direction:column; justify-content:center; gap:2px;
          border-right:1px solid var(--line);
        }
        .age-label strong { font-size:14px; font-weight:800; }
        .age-label span { font-size:11px; color:var(--muted); font-family:"JetBrains Mono",monospace; }
        .age-content { padding:12px 14px; }
        .age-content h4 { font-size:13px; font-weight:800; margin-bottom:4px; display:flex; align-items:center; gap:6px; }
        .age-content h4 i { width:20px; height:20px; display:grid; place-items:center; border-radius:6px; font-size:12px; font-style:normal; }
        .age-content p { font-size:12.5px; color:#475569; line-height:1.5; }
        .dot-blue { background: var(--blue-50); color:var(--blue); }
        .dot-orange { background: var(--orange-50); color:#b45309; }
        .dot-slate { background:#f1f5f9; }
        /* Experiment */
        .exp {
          background: var(--ink);
          color:#e2e8f0;
          border-radius:18px;
          padding:20px 18px;
          position:relative;
          overflow:hidden;
        }
        .exp::after{
          content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px;
          background: radial-gradient(circle at center, rgba(245,158,11,0.35) 0%, transparent 70%);
          pointer-events:none;
        }
        .exp-head { display:flex; gap:10px; align-items:center; margin-bottom:14px; }
        .exp-icon { width:36px; height:36px; border-radius:10px; background: var(--orange); display:grid; place-items:center; color:#000; font-size:18px; font-weight:900; }
        .exp h3 { font-size:16px; font-weight:800; color:#fff; }
        .exp h3 span { color: var(--orange); }
        .exp-grid { display:grid; grid-template-columns: 1fr; gap:10px; margin-top:12px; }
        .exp-step {
          background: rgba(255,255,255,0.06);
          border:1px solid rgba(255,255,255,0.12);
          border-radius:12px;
          padding:12px 12px;
          display:grid; grid-template-columns: 28px 1fr; gap:10px;
        }
        .exp-step b {
          width:28px; height:28px; border-radius:999px; background:#fff; color:#000;
          display:grid; place-items:center; font-size:12px; font-family:"JetBrains Mono",monospace; font-weight:800;
        }
        .exp-step p { font-size:12.5px; line-height:1.5; color:#cbd5e1; }
        .exp-step p strong { color:#fff; }
        .exp-kpis { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
        .kpi {
          font-family:"JetBrains Mono",monospace; font-size:11px;
          padding:6px 10px; border-radius:999px; border:1px solid rgba(255,255,255,0.18);
          background: rgba(255,255,255,0.06); color:#e2e8f0;
        }
        /* Footer */
        .footer {
          margin-top:26px; padding:16px 18px; background:#fff; border:1.5px solid var(--line); border-radius:14px;
          display:flex; flex-direction:column; gap:12px;
        }
        .sources { font-size:11px; color:var(--muted); font-family:"JetBrains Mono",monospace; }
        .tomorrow {
          display:flex; align-items:center; justify-content:space-between; gap:12px;
          background: linear-gradient(90deg, var(--blue-50), var(--orange-50));
          border:1px dashed #cbd5e1; border-radius:12px; padding:12px 14px;
        }
        .tomorrow-left { display:flex; align-items:center; gap:10px; }
        .tom-arrow { width:32px; height:32px; border-radius:999px; background:var(--blue); color:#fff; display:grid; place-items:center; font-size:14px; }
        .tomorrow strong { font-size:13px; font-weight:800; }
        .tomorrow span { font-size:11px; color:var(--muted); display:block; }
        .btn-copy {
          font-size:11px; font-weight:700; font-family:"JetBrains Mono",monospace;
          background:#fff; border:1.5px solid var(--line); border-radius:999px; padding:8px 12px; cursor:pointer;
        }
        .btn-copy:active { transform: scale(0.98); }
        @media (min-width: 640px){
          .hero-meta{ grid-template-columns: 1fr 1fr 1fr; }
          .age-grid{ grid-template-columns: 1fr 1fr; }
          .age-row{ grid-template-columns: 1fr; }
          .age-label{ flex-direction:row; align-items:center; justify-content:space-between; border-right:none; border-bottom:1px solid var(--line); padding:10px 14px; }
          .exp-grid{ grid-template-columns: 1fr 1fr; }
